experiment:
  name: "hmm_logreg_family_max_aggregation_clean_run"
  parent_experiment_name:
  description: "HMM + Logistical Regression + max aggregation for families (clean run)"
  random_seed: 42


     # where experiment dirs are written (e.g. F:/experiments)

data:
  data_root: "G:/output_root"       # path to all datasets
  chosen_scenario: 2                # 1 | 2 | 3 | 4 | all
  representation: "hmm"        # hmm | pc | hybrid
  taxon_rank: "Family"         # Family | Genus | Order | ...

split:
  calibration_fraction: 0.15
  novelty_fit_fraction: 0.15

pair_generation:
  # Per genome: up to k_pos same-taxon partners, ceil(k_pos/2) hard (most
  # similar) wrong-taxon negatives and floor(k_pos/2) random ones.
  k_pos: 10
  similarity_metric: "shared_count"   # shared_count | jaccard

features:
  use_intersection: true
  use_jaccard: true
  use_len1: true
  use_len2: true


training:
  type: 'logreg'              # logreg | xgboost
  logreg:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"

calibration:
  method: "isotonic"         # sigmoid | isotonic

aggregation:
  method: "logit_sum"              # mean | median | max | logit_sum | topk_mean
  topk_values: [1]         # null = use all, or e.g. [3, 5, 10]

novelty:
  use_normalized_probabilities: false
  # The threshold is the highest-TPR point whose FPR fits the first of these
  # budgets that admits a non-trivial operating point.
  max_fpr_budgets: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.75, 1.0]
#evaluation:
#  top_k: [1, 2, 3]
#  small_family_threshold: 6